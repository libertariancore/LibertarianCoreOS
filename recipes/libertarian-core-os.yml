# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: libertarian-core-os
description: Sovereign Digital Fortress - Gaming, AI, HTPC and Anti-Orwellian Tools

base-image: ghcr.io/ublue-os/bazzite
image-version: 40

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    install:
      # --- Core Sovereign & Security ---
      - fish
      - mullvad-vpn
      - keepassxc
      - syncthing
      - bleachbit
      - firewalld
      - openssl
      # --- Virtualisation ---
      - virt-manager
      - libvirt
      - qemu-kvm
      # --- System & Drivers ---
      - lshw
      - htop
      - mesa-va-drivers-freeworld
      - waydroid
      - podman-compose

  - type: flatpak
    install:
      # --- Privacy ---
      - com.brave.Browser
      - io.gitlab.librewolf-community.librewolf
      - org.torproject.torbrowser-launcher
      - io.simplex.simplex
      - com.github.tchx84.Flatseal
      - com.belmoussaoui.Authenticator
      # --- Workstation ---
      - org.onlyoffice.desktopeditors
      - net.ankiweb.Anki
      - io.github.ferraridamiano.ConverterNOW
      - org.gnome.Thunderbird
      - com.visualstudio.code
      # --- Gaming ---
      - com.usebottles.bottles
      - com.heroicgameslauncher.hgl
      - com.github.Matoking.protontricks
      - net.lutris.Lutris
      # --- Multimédia & HTPC ---
      - tv.kodi.Kodi
      - org.videolan.VLC
      - io.bassi.Amberol

  - type: script
    scripts:
      - post-install.sh
