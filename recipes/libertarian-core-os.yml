# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: libertarian-core-os
description: Sovereign Digital Fortress - Gaming, AI, HTPC and Anti-Orwellian Tools

base-image: ghcr.io/ublue-os/bazzite-kde
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    install:
      # --- Core Sovereign & Security ---
      - fish
      - mullvad-vpn
      - keepassxc
      - syncthing
      - bleachbit
      - firewalld
      - openssl
      # --- Virtualisation ---
      - virt-manager
      - libvirt
      - qemu-kvm
      # --- System & Drivers ---
      - lshw
      - htop
      - mesa-va-drivers-freeworld
      - waydroid
      - podman-compose
      - akmod-nvidia
      - xorg-x11-drv-nvidia
      - xorg-x11-drv-nvidia-cuda

  - type: script
    scripts:
      - post-install.sh
