# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: libertarian-core-os
description: Sovereign Digital Fortress - Gaming, AI, HTPC and Anti-Orwellian Tools

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    install:
      # --- Core Sovereign & Security ---
      - fish
      - keepassxc
      - syncthing
      - bleachbit
      - firewalld
      - openssl
      # --- Virtualisation ---
      - virt-manager
      - libvirt
      - qemu-kvm
      # --- System & Drivers ---
      - lshw
      - htop
      - podman-compose

  - type: script
    scripts:
      - post-install.sh
